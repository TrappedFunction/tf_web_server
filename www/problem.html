<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>题目详情</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="navbar">
        <a href="/" style="border:none; padding:0; font-size:1.2em;">⬅ 返回题目列表</a>
        <a href="#" id="editLink" style="background-color: #f39c12; color: white; border: none;">✏️ 编辑此题</a>
    </div>

    <div id="content" style="display:none;">
        <div class="detail-section">
            <h1 id="title" style="margin-top:0; border-bottom:1px solid #eee; padding-bottom:15px;">Loading...</h1>
            
            <div style="display:flex; gap:20px; margin-bottom:15px;">
                <div><strong>难度：</strong> <span id="difficulty"></span></div>
                <div><strong>算法：</strong> <span id="algo"></span></div>
                <div><strong>时间复杂度：</strong> <span id="time"></span></div>
                <div><strong>空间复杂度：</strong> <span id="space"></span></div>
            </div>
        </div>

        <div class="detail-section">
            <h2>📖 题目描述</h2>
            <p id="desc" style="white-space: pre-wrap;"></p>
        </div>
        
        <div class="detail-section">
            <h2>💡 解题思路</h2>
            <p id="idea" style="white-space: pre-wrap;"></p>
        </div>
        
        <div class="detail-section">
            <h2>💻 代码实现</h2>
            <pre id="code" class="code-block"></pre>
        </div>
    </div>
    
    <div id="errorMsg" style="text-align:center; color:red; display:none;"></div>

    <script>
        const difficultyMap = { 'Easy': '简单', 'Medium': '中等', 'Hard': '困难' };
        let isAdmin = false;

        async function fetchWithRetry(url, options = {}) {
            try { return await fetch(url, options); } 
            catch (err) { return await fetch(url, options); }
        }

        async function checkAuth() {
            try {
                const res = await fetchWithRetry('/api/admin/check');
                const data = await res.json();
                isAdmin = data.is_admin;
            } catch (e) { isAdmin = false; }
        }

        async function loadDetail() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            if (!id) return;

            // 1. 检查权限并控制 UI
            await checkAuth();
            const editLink = document.getElementById('editLink');
            if (editLink) {
                editLink.style.display = isAdmin ? 'inline-block' : 'none';
                editLink.href = `/edit.html?id=${id}`;
            }

            // 2. 加载数据
            try {
                const response = await fetchWithRetry(`/api/problems/${id}`);
                if (response.status === 404) {
                    document.getElementById('errorMsg').innerText = "题目不存在";
                    document.getElementById('errorMsg').style.display = 'block';
                    return;
                }
                const p = await response.json();
                
                document.getElementById('title').innerText = p.title;
                const diffSpan = document.getElementById('difficulty');
                diffSpan.innerText = difficultyMap[p.difficulty] || p.difficulty;
                diffSpan.className = `diff-${p.difficulty}`;
                
                document.getElementById('algo').innerText = p.algorithm;
                document.getElementById('desc').innerText = p.description;
                document.getElementById('idea').innerText = p.solution_idea;
                document.getElementById('time').innerText = p.time_complexity;
                document.getElementById('space').innerText = p.space_complexity;
                document.getElementById('code').innerText = p.code;

                document.getElementById('content').style.display = 'block';
            } catch (err) {
                document.getElementById('errorMsg').innerText = "加载失败";
                document.getElementById('errorMsg').style.display = 'block';
            }
        }

        loadDetail();
    </script>
</body>
</html>
