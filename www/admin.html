<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>管理员登录</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f0f2f5; }
        .login-box { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; }
        input { padding: 10px; border: 1px solid #ccc; border-radius: 4px; width: 200px; margin-bottom: 20px; }
        button { padding: 10px 20px; background: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #2980b9; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>TF Algo Admin</h2>
        <input type="password" id="password" placeholder="请输入管理员密码" onkeypress="if(event.key==='Enter') login()">
        <br>
        <button onclick="login()">登录</button>
    </div>

    <script>
        async function login() {
            const pwd = document.getElementById('password').value;
            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                    body: `password=${encodeURIComponent(pwd)}`
                });
                const data = await res.json();
                if (data.status === 'success') {
                    alert("登录成功！");
                    window.location.href = "/"; // 跳转回首页
                } else {
                    alert("登录失败: " + data.msg);
                }
            } catch (err) {
                alert("请求出错");
            }
        }
    </script>
</body>
</html>
